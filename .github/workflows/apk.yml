# Construit l'APK Android à chaque mise à jour du jeu et le publie dans les Releases.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le jeu
        run: |
          npm install
          npm run web
          npx cap add android

      - name: Icônes et écran de démarrage
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#151226' --iconBackgroundColorDark '#151226'
          --splashBackgroundColor '#151226' --splashBackgroundColorDark '#151226'

      - name: Synchroniser et numéroter la version
        run: |
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Construire l'APK signé
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=imposteur \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../Imposteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Imposteur-apk
          path: Imposteur.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Imposteur v1.${{ github.run_number }}
          body: Télécharge **Imposteur.apk** ci-dessous et ouvre-le sur ton téléphone Android pour l'installer.
          files: Imposteur.apk
          make_latest: true
