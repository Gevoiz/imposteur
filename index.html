<title>Imposteur</title>
<meta name="description" content="Le jeu de l'imposteur entre amis, sur un seul téléphone.">
<meta name="theme-color" content="#151226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#151226; --bg2:#1f1a38; --card:#2a2350; --line:#3b3270;
  --text:#f4f1ff; --muted:#a79fd0;
  --primary:#ff4f7b; --primary2:#ff8a5c; --ok:#3ddc97; --bad:#ff5a5a; --gold:#ffd166;
  --radius:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#2b2160 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 20px);display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
.center{justify-content:center;align-items:stretch;text-align:center}
h1{font-size:2.4rem;margin:0;letter-spacing:-.5px}
h2{font-size:1.5rem;margin:0}
h3{font-size:1rem;margin:6px 0 0;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
p{margin:0;line-height:1.45}
.muted{color:var(--muted)}
.logo{font-size:5rem;line-height:1;filter:drop-shadow(0 8px 24px #ff4f7b66)}
.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1}
.back{background:var(--card);border:0;color:var(--text);width:42px;height:42px;border-radius:12px;font-size:1.2rem}
.btn{appearance:none;border:0;border-radius:var(--radius);padding:15px 18px;font:inherit;font-weight:700;font-size:1.05rem;color:var(--text);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.big{padding:20px;font-size:1.2rem}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 8px 24px #ff4f7b44}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn:disabled{opacity:.4}
.btn.sq{width:54px;padding:0;font-size:1.6rem}
.spacer{flex:1}
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.addrow{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--bg2);border:0;box-shadow:inset 0 0 0 1px var(--line);color:var(--text);border-radius:14px;padding:14px;font:inherit;font-size:1.05rem;-webkit-user-select:text;user-select:text}
input[type=text]:focus{outline:2px solid var(--primary)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:8px 8px 8px 10px;font-weight:600}
.plist li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#151226;flex:none}
.x{background:transparent;border:0;color:var(--muted);font-size:1.1rem;width:36px;height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 14px;font:inherit;font-weight:600;background:var(--bg2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--text);color:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);color:var(--text);font-size:1.3rem;font-weight:800}
.stepper b{min-width:24px;text-align:center;font-size:1.2rem}
.switch{position:relative;width:52px;height:32px;border-radius:999px;background:var(--card);border:0;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:24px;background:#fff}
.warn{color:var(--gold);font-size:.9rem}
.secret{background:linear-gradient(160deg,#3a2f7a,#241d4d);border-radius:26px;padding:34px 20px;box-shadow:0 20px 60px #0008,inset 0 0 0 1px #5a4ca8;display:flex;flex-direction:column;gap:12px;align-items:center}
.secret .word{font-size:2.6rem;font-weight:900;letter-spacing:-.5px;word-break:break-word}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.85rem;background:var(--card)}
.badge.imp{background:var(--bad);color:#fff}
.badge.civ{background:var(--ok);color:#0f2b20}
.badge.white{background:#fff;color:#151226}
.big-name{font-size:2.2rem;font-weight:900;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{border:0;border-radius:16px;padding:16px 10px;font:inherit;font-weight:700;background:var(--bg2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .35s var(--spring),background .25s,box-shadow .25s}
.pick:active{transform:scale(.92);transition-duration:.08s}
.pick.sel{box-shadow:inset 0 0 0 3px var(--primary);background:#3a2140}
.grid .pick{animation:slidein .5s var(--spring) both;animation-delay:calc(var(--d,0) * 60ms + 150ms)}
.grid .pick.sel{animation:selpulse 1.2s ease-in-out infinite}
@keyframes selpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wordform{display:flex;flex-direction:column;gap:8px}
.delta{font-weight:900;color:var(--ok);min-width:34px;text-align:right}
.delta.zero{color:var(--muted)}
.votes{font-size:.85rem;color:var(--muted);font-weight:700}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:12px 14px;font-weight:700;animation:slidein .5s var(--spring) both;animation-delay:calc(var(--d,0) * 70ms + 200ms)}
.rank li span:nth-child(2){flex:1}
.rank .m{width:28px;text-align:center;font-size:1.3rem}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.hist li{background:var(--bg2);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px}
.hist .when{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hist .words{font-weight:800}
.hist .who{font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.verdict{font-weight:800;font-size:.95rem}
.order{counter-reset:o;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.order li{counter-increment:o;display:flex;align-items:center;gap:12px;font-weight:600}
.order li::before{content:counter(o);width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.order li:first-child::before{background:var(--gold);color:#151226}
.banner{font-size:2rem;font-weight:900}
.rules{text-align:left;display:flex;flex-direction:column;gap:12px}
.rules b{color:var(--gold)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Animations ---------- */
:root{--spring:cubic-bezier(.2,1.5,.4,1);--out:cubic-bezier(.2,.8,.2,1)}

/* Fond vivant : deux halos qui dérivent */
body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
body::before{background:#ff4f7b;top:-35vmax;left:-30vmax;animation:drift1 18s ease-in-out infinite alternate}
body::after{background:#5b3cc4;bottom:-40vmax;right:-30vmax;animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(25vmax,20vmax) scale(1.2)}}
@keyframes drift2{to{transform:translate(-20vmax,-25vmax) scale(1.15)}}

/* Entrée d'écran : chaque bloc arrive en cascade */
#app>.screen.anim>*{animation:rise .55s var(--spring) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* Boutons qui rebondissent */
.btn,.chip,.back,.stepper button,.x{transition:transform .35s var(--spring),background .25s,color .25s,box-shadow .25s,opacity .25s}
.btn:active,.chip:active,.back:active,.stepper button:active{transform:scale(.92);transition-duration:.08s}
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff5 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
.btn.primary:disabled::after{display:none}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.chip.just{animation:pop .4s var(--spring)}
.switch::after{transition:left .35s var(--spring),background .25s}
.switch{transition:background .25s}

/* Accueil */
.logo{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
h1.shimmer{background:linear-gradient(90deg,#fff 0%,#ffd166 25%,#ff8a5c 50%,#ff4f7b 75%,#fff 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-200% center}}

/* Passe le téléphone */
.wiggle{display:inline-block;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.big-name{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 0 #ffd16600;transform:scale(1)}50%{text-shadow:0 0 28px #ffd16699;transform:scale(1.05)}}

/* Révélation du mot : carte qui se retourne */
.stage{perspective:900px}
.flipin{animation:flip .8s var(--spring) both}
@keyframes flip{from{transform:rotateY(-180deg) scale(.7);opacity:0}40%{opacity:1}to{transform:none}}
.flipin .word{animation:zoomword .6s .35s var(--spring) both}
@keyframes zoomword{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

/* Suspense de l'élimination */
.drum{font-size:4rem;animation:drum .18s linear infinite}
@keyframes drum{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-6deg)}75%{transform:translate(4px,-2px) rotate(6deg)}}
.secret.shake{animation:shake .5s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.stamp{animation:stamp .55s var(--spring) both}
@keyframes stamp{from{opacity:0;transform:scale(3) rotate(-18deg)}to{opacity:1;transform:rotate(-3deg)}}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 0 #fff8,0 20px 60px #0008}to{box-shadow:0 0 0 40px #fff0,0 20px 60px #0008}}

/* Listes */
.plist li.new{animation:pop .5s var(--spring)}
.plist li.out{animation:out .25s ease-in forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(60px) scale(.9)}}
.bump{animation:bump .35s var(--spring)}
@keyframes bump{from{transform:scale(1.7);color:var(--gold)}to{transform:none}}
.order li{animation:slidein .5s var(--spring) both;animation-delay:calc(var(--d,0) * 70ms + 200ms)}
@keyframes slidein{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}


/* Fin de partie */
.banner{animation:banner .9s var(--spring) both}
@keyframes banner{from{opacity:0;transform:scale(.2) rotate(-12deg)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const COLORS = ['#ffd166','#3ddc97','#6ec8ff','#ff8a5c','#c49bff','#ff6fae','#9be564','#ffb86b','#7ef0e0','#f7a1ff'];
const color = i => COLORS[i % COLORS.length];
const ini = n => (/^P(\d+)$/.exec(n) || [])[1] || n[0].toUpperCase();
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

impOpts.cats = impOpts.cats.filter(c => c in WORDS || c === MINE); // thèmes renommés/supprimés entre deux versions

let timers = [];

function clearTimers() { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }

// `key` : quand on re-rend le même écran (ex. ajout d'un joueur), pas d'animation ni de retour en haut.
let lastKey = null;
function render(html, acts = {}, onSubmit, key) {
  clearTimers();
  const same = key && key === lastKey;
  lastKey = key || null;
  app.innerHTML = `<div class="screen">${html}</div>`;
  const root = app.firstElementChild;
  if (!same) {
    root.classList.add('anim');
    [...root.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 10)));
  }
  app.onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.disabled) return SFX.play('nope');
    if (!acts[b.dataset.act]) return;
    const act = b.dataset.act;
    SFX.play(act in ACT_SOUND ? ACT_SOUND[act] : 'tap');
    acts[act](b.dataset.arg, b);
  };
  app.onsubmit = e => { e.preventDefault(); onSubmit && onSubmit(e.target); };
  if (!same) window.scrollTo(0, 0);
}

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
const SFX = (() => {
  let ctx, muted = store.get('muted', false);
  const ac = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, dur, { type = 'sine', vol = .2, slide = 0, delay = 0 } = {}) {
    if (muted) return;
    const c = ac(), t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, { vol = .2, delay = 0, freq = 1000, q = 1 } = {}) {
    if (muted) return;
    const c = ac(), t = c.currentTime + delay;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  }
  const play = {
    tap: () => tone(520, .09, { type: 'triangle', vol: .18, slide: 760 }),
    back: () => tone(600, .1, { type: 'triangle', vol: .15, slide: 380 }),
    pop: () => { tone(380, .14, { vol: .25, slide: 950 }); tone(1200, .06, { type: 'triangle', vol: .06, delay: .05 }); },
    del: () => { noise(.2, { freq: 1800, vol: .18 }); tone(480, .16, { type: 'triangle', vol: .12, slide: 180 }); },
    tick: () => tone(900, .05, { type: 'square', vol: .05 }),
    toggle: () => { tone(440, .07, { type: 'square', vol: .06 }); tone(660, .09, { type: 'square', vol: .06, delay: .06 }); },
    nope: () => tone(180, .18, { type: 'sawtooth', vol: .08, slide: 120 }),
    flip: () => { noise(.3, { freq: 3000, vol: .15, q: .6 }); tone(260, .35, { vol: .14, slide: 1100, delay: .05 }); tone(1320, .25, { type: 'triangle', vol: .08, delay: .35 }); },
    go: () => [523, 659, 784].forEach((f, i) => tone(f, .14, { type: 'triangle', vol: .14, delay: i * .07 })),
    // roulement de tambour qui monte en puissance
    drum: dur => {
      const n = Math.floor(dur / .065);
      for (let i = 0; i < n; i++) {
        const k = i / n;
        noise(.07, { freq: 900 + 600 * k, vol: .04 + .22 * k, delay: i * .065, q: .8 });
        if (i % 4 === 0) tone(90, .12, { vol: .1 + .25 * k, slide: 55, delay: i * .065 });
      }
    },
    // coup de tampon + fanfare
    reveal: () => {
      tone(140, .5, { vol: .55, slide: 40 });
      noise(.35, { freq: 400, vol: .35, q: .5 });
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .6 : .18, { type: 'triangle', vol: .16, delay: .25 + i * .12 }));
      [659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 3 ? .6 : .18, { type: 'sine', vol: .08, delay: .25 + i * .12 }));
    }
  };
  return {
    play: (name, ...a) => { try { play[name] && play[name](...a); } catch {} },
    get muted() { return muted; },
    toggleMute() { muted = !muted; store.set('muted', muted); return muted; }
  };
})();
// Son joué selon le bouton (data-act) ; par défaut un petit « tap »
const ACT_SOUND = {
  del: 'del', auto: 'pop', see: 'flip', reveal: null, mute: null, white: 'toggle', knows: 'toggle',
  back: 'back', quit: 'back', menu: 'back', start: 'go', again: 'go', next: 'tap', votes: 'toggle',
  delw: 'del', clear: 'del', resetScores: 'del', pickv: 'tick',
  impm: 'tick', impp: 'tick', autom: 'tick', autop: 'tick', cat: 'tick'
};

// Relance une animation CSS sur un élément (ex. chiffre qui rebondit)
function replay(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = pick(COLORS);
    c.style.animationDuration = 1.5 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .5 + 's';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4500);
}

function playerActs(rerender) {
  return {
    del: (i, b) => {
      b.closest('li').classList.add('out');
      setTimeout(() => { players.splice(+i, 1); store.set('players', players); rerender(); }, 230);
    },

    autop: () => { autoCount = Math.min(20, autoCount + 1); $('#autoCount').textContent = autoCount; replay($('#autoCount'), 'bump'); },
    auto: () => {
      players = Array.from({ length: autoCount }, (_, i) => 'P' + (i + 1)); store.set('players', players); rerender();
      document.querySelectorAll('.plist li').forEach((li, i) => { li.style.animationDelay = i * 40 + 'ms'; li.classList.add('new'); });
    },
    submit: () => {
      const inp = $('#pname'), name = inp.value.trim();

      if (players.some(p => p.toLowerCase() === name.toLowerCase())) { SFX.play('nope'); inp.value = ''; inp.placeholder = 'Nom déjà pris !'; return; }
      SFX.play('pop');
      players.push(name); store.set('players', players); rerender(true);
      const li = document.querySelector('.plist li:last-child'); if (li) li.classList.add('new');
    }
  };
}
function catChips(all, selected) {
  return `<div class="chips">
    <button class="chip ${selected.length ? '' : 'on'}" data-act="cat" data-arg="">Tout</button>
    ${all.map(c => `<button class="chip ${selected.includes(c) ? 'on' : ''}" data-act="cat" data-arg="${esc(c)}">${esc(c)}</button>`).join('')}
  </div>`;
}
// Met à jour les puces de thèmes sans re-rendre l'écran
function syncChips(selected, changed) {
  document.querySelectorAll('[data-act=cat]').forEach(ch => {
    const on = ch.dataset.arg ? selected.includes(ch.dataset.arg) : !selected.length;
    ch.classList.toggle('on', on);
    if (on && ch === changed) replay(ch, 'just');
  });
}
function toggleCat(list, c) {
  if (!c) return [];
  const i = list.indexOf(c);
  if (i >= 0) list.splice(i, 1); else list.push(c);
  return list;
}

/* ---------- Imposteur : configuration ---------- */
function impSetup(focus) {
  const n = players.length;
  const maxBad = Math.max(1, Math.floor((n - 1) / 2));
  const maxImp = Math.max(1, maxBad - (impOpts.white ? 1 : 0));

  const bad = impOpts.imp + (impOpts.white ? 1 : 0);
  const ok = n >= 3 && bad <= maxBad;
  store.set('impOpts', impOpts);
  const rr = f => impSetup(f);
  const pa = playerActs(rr);
  const setImp = v => { impOpts.imp = v; store.set('impOpts', impOpts); $('#impCount').textContent = v; replay($('#impCount'), 'bump'); };
  render(`
    <div class="top"><button class="back" data-act="back">←</button><h2>Imposteur</h2></div>

      <div class="row"><div>L'imposteur sait qu'il l'est<small>Sinon, il le découvre en jouant</small></div>

  }, pa.submit, 'imp');

}

/* ---------- Imposteur : partie ---------- */
let G;
function startImp() {
  const fromCats = cats => cats.flatMap(c => themeWords(c).map(p => [p, c]));
  let pool = fromCats(impOpts.cats);
  if (!pool.length) pool = fromCats(allThemes().filter(c => c !== HOT));
  const fresh = pool.filter(([p]) => !recentPairs.includes(p[0]));
  if (fresh.length) pool = fresh;
  let [pair, cat] = pick(pool);
  recentPairs = [pair[0], ...recentPairs].slice(0, 200);
  store.set('recentPairs', recentPairs);
  if (Math.random() < .5) pair = [pair[1], pair[0]];

  const n = players.length;
  const roles = [];
  for (let i = 0; i < impOpts.imp; i++) roles.push('imp');
  if (impOpts.white) roles.push('white');
  while (roles.length < n) roles.push('civ');
  const shuffled = shuffle(roles);
  G = { civ: pair[0], imp: pair[1], cat, idx: 0, votes: null,
        ps: players.map((name, i) => ({ name, i, role: shuffled[i] })) };
  passPhone();
}

function passPhone() {
  const p = G.ps[G.idx];
  render(`
    <p class="muted" style="text-align:center">Joueur ${G.idx + 1} / ${G.ps.length}</p>
    <div class="spacer"></div>
    <div class="center screen" style="flex:0">
      <div style="font-size:4rem"><span class="wiggle">📱</span></div>
      <p class="muted">Passe le téléphone à</p>
      <div class="big-name">${esc(p.name)}</div>
      <p class="muted">Les autres, ne regardez pas !</p>
    </div>
    <div class="spacer"></div>
    <button class="btn big primary" data-act="see">C'est moi, voir mon mot 👀</button>
    <button class="btn ghost" data-act="quit">Quitter la partie</button>
  `, { see: showWord, quit: impSetup });
}

function showWord() {
  buzz(40);
  const p = G.ps[G.idx];
  let inner;
  if (p.role === 'white') {
    inner = `<span class="badge white">🤍 MISTER WHITE</span><div class="word">Aucun mot</div><p class="muted">Écoute les autres et bluffe !</p>`;
  } else {
    const w = p.role === 'imp' ? G.imp : G.civ;
    const tag = p.role === 'imp' && impOpts.knows ? `<span class="badge imp">😈 TU ES L'IMPOSTEUR</span>` : `<span class="badge">Ton mot secret</span>`;
    inner = `${tag}<div class="word">${esc(w)}</div>`;
  }
  const last = G.idx === G.ps.length - 1;
  render(`
    <p class="muted" style="text-align:center">${esc(p.name)}</p>
    <div class="spacer"></div>
    <div class="stage"><div class="secret flipin">${inner}</div></div>
    <div class="spacer"></div>
    <button class="btn big primary" data-act="next">${last ? 'Tout le monde a vu → Jouer' : 'Cacher et passer ➜'}</button>
  `, { next: () => { if (last) discuss(); else { G.idx++; passPhone(); } } });
}

function discuss() {
  // Mister White ne commence jamais
  const starters = G.ps.filter(p => p.role !== 'white');
  const first = pick(starters.length ? starters : G.ps);
  const k = G.ps.indexOf(first);
  const order = G.ps.slice(k).concat(G.ps.slice(0, k));
  const many = G.ps.filter(p => p.role !== 'civ').length > 1;
  render(`
    <div class="top"><h2>À vous de jouer !</h2></div>
    <div class="card">
      <p>Chacun dit <b>un mot</b> en rapport avec son mot secret, dans cet ordre :</p>
    </div>
    <ol class="order">${order.map((p, d) => `<li style="--d:${d}"><span class="av" style="background:${color(p.i)}">${esc(ini(p.name))}</span>${esc(p.name)}</li>`).join('')}</ol>
    <p class="muted" style="text-align:center">Puis débattez : qui est ${many ? 'parmi les imposteurs' : "l'imposteur"} ?</p>
    <div class="spacer"></div>
    ${impOpts.votes
      ? `<button class="btn big primary" data-act="vote">Passer au vote secret 🗳️</button>`
      : `<button class="btn big primary" data-act="reveal">Révéler ${many ? 'les imposteurs' : "l'imposteur"} 😈</button>`}
  `, { reveal: suspense, vote: () => { G.votes = []; votePass(0); } });
}

/* ---------- Vote secret (option) ---------- */
function votePass(i) {
  const p = G.ps[i];
  render(`

function voteSelect(i) {

function suspense() {
  const many = G.ps.filter(p => p.role !== 'civ').length > 1;
  render(`
    <div class="spacer"></div>

    <div class="spacer"></div>
  `);
  buzz([30, 60, 30, 60, 30, 60, 30]);
  SFX.play('drum', 1.6);
  timers.push(setTimeout(revealImp, 1600));
}

// Calcule les points du vote : civil qui vise un imposteur +1, imposteur pas le plus voté +2
function tallyVotes() {
  const got = G.ps.map(() => 0);
  G.votes.forEach(t => got[t]++);
  const max = Math.max(...got);
  const caught = G.ps.map((p, i) => got[i] === max);
  const delta = G.ps.map((p, i) => p.role === 'civ'
    ? (G.ps[G.votes[i]].role !== 'civ' ? 1 : 0)
    : (caught[i] ? 0 : 2));
  return { got, caught, delta };
}

function revealImp() {
  const bad = G.ps.filter(p => p.role !== 'civ');
  const roleBadge = r => ({ civ: '<span class="badge civ">Civil</span>', imp: '<span class="badge imp">Imposteur</span>', white: '<span class="badge white">Mr White</span>' }[r]);
  const V = G.votes ? tallyVotes() : null;
  if (V) G.ps.forEach((p, i) => scores[p.name] = (scores[p.name] || 0) + V.delta[i]);
  store.set('scores', scores);
  history.unshift({
    t: Date.now(), civ: G.civ, imp: G.imp, cat: G.cat,
    bad: bad.map(p => ({ name: p.name, role: p.role, caught: V ? V.caught[p.i] : null }))
  });
  history = history.slice(0, 100);
  store.set('history', history);
  const ranking = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  confetti(); buzz(120); SFX.play('reveal');
  render(`
    <div class="center screen" style="flex:0"><div class="banner">${bad.length > 1 ? 'Les imposteurs étaient…' : "L'imposteur était…"}</div></div>
    <div class="secret flash">${bad.map((p, d) => `
      <div class="big-name">${esc(p.name)}</div>
      <span class="badge ${p.role} stamp" style="font-size:1.1rem;animation-delay:${300 + d * 250}ms">${p.role === 'imp' ? '😈 IMPOSTEUR' : '🤍 MISTER WHITE'}</span>
      ${V ? `<p class="verdict">${V.caught[p.i] ? '🎯 Démasqué !' : '😏 Il s\'en sort ! +2'}</p>` : ''}`).join('')}
    </div>
    <div class="card">
      <div class="row"><span>Mot des civils</span><b>${esc(G.civ)}</b></div>
      <div class="row"><span>Mot de l'imposteur</span><b>${esc(G.imp)}</b></div>
    </div>
    <ul class="plist">${G.ps.map(p => `<li><span class="av" style="background:${color(p.i)}">${esc(ini(p.name))}</span><span>${esc(p.name)}${V ? ` <span class="votes">🗳️ ${V.got[p.i]}</span>` : ''}</span>${roleBadge(p.role)}${V ? `<span class="delta ${V.delta[p.i] ? '' : 'zero'}">+${V.delta[p.i]}</span>` : ''}</li>`).join('')}</ul>
    ${V ? `<h3>Scores de la soirée</h3>${rankHTML(ranking)}` : ''}
    <div class="spacer"></div>
    <button class="btn big primary" data-act="again">🔁 Rejouer</button>
    <button class="btn" data-act="menu">Menu</button>
  `, { again: startImp, menu: home });
}

function rankHTML(ranking) {
  return `<ul class="rank">${ranking.map(([n, s], i) => `<li style="--d:${i}"><span class="m">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span>${esc(n)}</span><b>${s} pt${s > 1 ? 's' : ''}</b></li>`).join('')}</ul>`;

/* ---------- Historique & scores ---------- */
function historyScreen() {
  const ranking = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const when = t => new Date(t).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const label = b => `${b.role === 'imp' ? '😈' : '🤍'} ${esc(b.name)}${b.caught === true ? ' 🎯' : b.caught === false ? ' 😏' : ''}`;
  render(`
    <div class="top"><button class="back" data-act="back">←</button><h2>📜 Historique</h2></div>
    <h3>Scores de la soirée</h3>
    ${ranking.length ? rankHTML(ranking) + `<button class="btn ghost" data-act="resetScores">Remettre les scores à zéro</button>`
      : `<p class="empty">Active « Votes &amp; scores » dans les options pour compter les points.</p>`}
    <h3>Dernières parties (${history.length})</h3>
    ${history.length ? `<ul class="hist">${history.map(h => `
      <li><div class="when"><span>${when(h.t)}</span><span>${esc(h.cat || '')}</span></div>
        <div class="words">${esc(h.civ)} <span class="muted">vs</span> ${esc(h.imp)}</div>
        <div class="who">${h.bad.map(label).join(' · ')}</div></li>`).join('')}</ul>
      <button class="btn ghost" data-act="clear">Effacer l'historique</button>`
      : `<p class="empty">Aucune partie jouée pour l'instant.</p>`}
  `, {
    back: home,
    // double appui pour confirmer
    resetScores: (_, b) => {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Appuie encore pour confirmer'; return; }
      scores = {}; store.set('scores', scores); historyScreen();
    },
    clear: (_, b) => {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Appuie encore pour confirmer'; return; }
      history = []; store.set('history', history); historyScreen();
    }
  }, null, 'hist');
}

/* ---------- Démarrage ---------- */
home();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
